project_id = "danarapi"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173", "id.danarapi.app://auth/callback"]
enable_signup = true

[auth.email]
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Kode verifikasi Danarapi"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Kode pemulihan Danarapi"
content_path = "./supabase/templates/recovery.html"

[functions.ledger]
verify_jwt = true

[functions.ios-data]
verify_jwt = true

[functions.export-data]
verify_jwt = true

[functions.receipt-scan]
verify_jwt = true

[functions.review-retention]
verify_jwt = false
